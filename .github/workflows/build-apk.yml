name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Katib Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake via SDKManager
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Katib-Android-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: كاتب المحاضرات للأندرويد v1.1.0
          body: |
            # كاتب المحاضرات — نسخة الأندرويد v1.1.0 🎙️

            تحديث الواجهة والاعتماد على الذكاء الاصطناعي السحابي المباشر (Google Gemini AI):
            
            ### التحسينات في v1.1.0:
            - **تفريغ فوري وسحابي**: استخدام نموذج Google Gemini AI السريع والدقيق بدون الحاجة لتحميل أي نموذج محلي ضخم (~500MB).
            - **واجهة مستخدم محسنة**: أزرار نظيفة ومرتبة بالوسط واختيار مباشر للملفات.
            - **أزرار إدارة النص**: نسخ، ومشاركة، وحذف النص بسهولة.
            - **تسجيل صوتي فوري**: تسجيل الميكروفون مع تفريغ فوري بالذكاء الاصطناعي.
            
            ---
            *الملف التنفيذي `app-debug.apk` مرفق أدناه وجاهز للتحميل والتثبيت المباشر على الهاتف.*
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
